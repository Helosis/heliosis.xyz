name: Autonomous Market Data Updater

on:
  schedule:
    # Runs every hour at minute 5 (UTC)
    - cron: '5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and recalculate funding & arbitrage yields
        run: |
          python scripts/update_market_data.py

      - name: Commit and push if data changed
        run: |
          git config --global user.name "Heliosis Autonomous Bot"
          git config --global user.email "bot@heliosis.xyz"
          git add data/latest.json
          git diff --staged --quiet || (git commit -m "Auto-update market data [skip ci]" && git push)
